version: '3.8'

services:
  user-service:
    volumes:
      - ./services/user-service/src:/app/src
      - ./services/user-service/package.json:/app/package.json
    environment:
      - NODE_ENV=development
    command: npm run dev

  game-lifecycle-service:
    volumes:
      - ./services/game-lifecycle-service/src:/app/src
      - ./services/game-lifecycle-service/package.json:/app/package.json
