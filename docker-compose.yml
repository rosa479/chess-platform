  community-service:
    build:
      context: ./services/community-service
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - REDIS_URL=redis://redis:6379
    depends_on:
