  analysis-tools-service:
    build:
      context: ./services/analysis-tools-service
      dockerfile: Dockerfile
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=development
      - PORT=3011
      - REDIS_URL=redis://redis:6379
      - STOCKFISH_PATH=stockfish
      - STOCKFISH_DEPTH=15
      - STOCKFISH_THREADS=4
      - STOCKFISH_HASH=256
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rating-service:
    build:
      context: ./services/rating-service
      dockerfile: Dockerfile
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=development
      - PORT=3012
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  game-history-service:
    build:
      context: ./services/game-history-service
      dockerfile: Dockerfile
    ports:
      - "3013:3013"
    environment:
      - NODE_ENV=development
      - PORT=3013
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_WS_URL=ws://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      user-service:
        condition: service_healthy
      websocket-gateway-service:
        condition: service_healthy
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    stdin_open: true
    tty: true

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: chess-platform-network
